services:

  ApiTarefasContainer:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: ApiTarefasContainer

    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: ${SA_PASSWORD}

    ports:

      - "127.0.0.1:14330:1433"

    volumes:

      - ApiTarefasContainer_data:/var/opt/mssql

volumes:

  ApiTarefasContainer_data:
